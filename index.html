<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#070a0f"
>

<title>EIT Academy</title>

<style>

:root{
  --bg:#070a0f;
  --panel:#0d121a;
  --panel2:#111821;
  --border:rgba(255,255,255,.09);

  --text:#f4f7fb;
  --muted:#8d98a8;

  --electric:#3b82f6;
  --instrument:#22c55e;
  --telecom:#a855f7;
  --ex:#f59e0b;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;

  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}


/* =========================================================
   APP
========================================================= */

#app{
  min-height:100vh;
  padding-bottom:90px;
}


/* =========================================================
   TOP BAR
========================================================= */

.eit-topbar{

  position:sticky;
  top:0;
  z-index:100;

  height:68px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:10px 16px;

  background:
    rgba(7,10,15,.94);

  backdrop-filter:blur(18px);

  border-bottom:
    1px solid var(--border);
}

.eit-brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.eit-logo{

  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

  font-size:16px;
  font-weight:1000;

  letter-spacing:-1px;

  box-shadow:
    0 8px 30px
    rgba(37,99,235,.25);
}

.eit-brand-title{
  font-size:17px;
  font-weight:900;
}

.eit-brand-subtitle{

  margin-top:2px;

  font-size:10px;

  color:var(--muted);

  letter-spacing:1.5px;

  font-weight:800;
}

.eit-profile-button{

  width:42px;
  height:42px;

  border:
    1px solid var(--border);

  border-radius:50%;

  background:var(--panel2);

  color:var(--text);

  font-size:20px;
}


/* =========================================================
   MAIN
========================================================= */

.eit-main{

  width:min(760px,100%);

  margin:0 auto;

  padding:
    18px
    15px
    30px;
}


/* =========================================================
   HERO
========================================================= */

.eit-hero{

  position:relative;

  overflow:hidden;

  padding:24px 20px;

  margin-bottom:24px;

  border:
    1px solid
    rgba(59,130,246,.22);

  border-radius:24px;

  background:

    radial-gradient(
      circle at 90% 10%,
      rgba(59,130,246,.22),
      transparent 38%
    ),

    radial-gradient(
      circle at 10% 100%,
      rgba(168,85,247,.14),
      transparent 42%
    ),

    var(--panel);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.25);
}

.eit-eyebrow{

  color:#60a5fa;

  font-size:10px;

  font-weight:1000;

  letter-spacing:2px;

  margin-bottom:9px;
}

.eit-hero h1{

  position:relative;

  z-index:1;

  margin:0;

  font-size:30px;

  line-height:1.05;

  letter-spacing:-1px;
}

.eit-hero p{

  position:relative;

  z-index:1;

  margin:12px 0 0;

  max-width:520px;

  color:var(--muted);

  font-size:14px;

  line-height:1.55;
}


/* =========================================================
   SECTION
========================================================= */

.eit-section-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin:
    24px
    2px
    12px;
}

.eit-section-title strong{

  font-size:18px;

  font-weight:900;
}

.eit-section-title span{

  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   FACULTIES
========================================================= */

.eit-faculties{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:12px;
}

.eit-faculty{

  position:relative;

  overflow:hidden;

  min-height:190px;

  padding:18px;

  border:
    1px solid
    var(--border);

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      var(--panel2),
      var(--panel)
    );

  color:var(--text);

  text-align:left;

  transition:
    transform .18s ease,
    border-color .18s ease;
}

.eit-faculty:hover{

  border-color:
    rgba(255,255,255,.18);
}

.eit-faculty-icon{

  width:48px;
  height:48px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:15px;

  margin-bottom:18px;

  font-size:24px;

  background:
    rgba(255,255,255,.07);
}

.eit-faculty-code{

  font-size:10px;

  font-weight:1000;

  letter-spacing:1.8px;

  opacity:.6;

  margin-bottom:5px;
}

.eit-faculty-title{

  font-size:20px;

  font-weight:950;

  letter-spacing:-.4px;
}

.eit-faculty-text{

  margin-top:6px;

  color:var(--muted);

  font-size:11px;

  line-height:1.45;
}

.eit-faculty-arrow{

  position:absolute;

  right:16px;
  bottom:15px;

  font-size:20px;

  opacity:.55;
}


/* FACULTY COLORS */

.eit-electric{
  border-color:
    rgba(59,130,246,.25);
}

.eit-electric
.eit-faculty-icon{

  color:#60a5fa;

  background:
    rgba(59,130,246,.13);
}

.eit-instrument{
  border-color:
    rgba(34,197,94,.25);
}

.eit-instrument
.eit-faculty-icon{

  color:#4ade80;

  background:
    rgba(34,197,94,.13);
}

.eit-telecom{
  border-color:
    rgba(168,85,247,.25);
}

.eit-telecom
.eit-faculty-icon{

  color:#c084fc;

  background:
    rgba(168,85,247,.13);
}

.eit-ex{
  border-color:
    rgba(245,158,11,.25);
}

.eit-ex
.eit-faculty-icon{

  color:#fbbf24;

  background:
    rgba(245,158,11,.13);
}


/* =========================================================
   INFO
========================================================= */

.eit-info-card{

  margin-top:14px;

  padding:17px;

  border:
    1px solid
    var(--border);

  border-radius:18px;

  background:var(--panel);
}

.eit-info-row{

  display:flex;

  align-items:center;

  gap:12px;
}

.eit-info-icon{

  width:38px;
  height:38px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:
    rgba(59,130,246,.10);

  font-size:18px;
}

.eit-info-title{

  font-size:13px;

  font-weight:850;
}

.eit-info-text{

  margin-top:3px;

  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.eit-bottom-nav{

  position:fixed;

  left:50%;
  bottom:12px;

  z-index:200;

  transform:
    translateX(-50%);

  width:min(
    calc(100% - 24px),
    700px
  );

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:5px;

  padding:7px;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius:22px;

  background:
    rgba(15,20,28,.94);

  backdrop-filter:blur(20px);

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.45);
}

.eit-nav-button{

  min-height:58px;

  border:0;

  border-radius:16px;

  background:transparent;

  color:#7f8997;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:4px;
}

.eit-nav-button.active{

  color:#fff;

  background:
    rgba(59,130,246,.16);
}

.eit-nav-icon{

  font-size:20px;

  line-height:1;
}

.eit-nav-label{

  font-size:10px;

  font-weight:800;
}


/* =========================================================
   SCREENS
========================================================= */

.eit-screen{

  display:none;

  min-height:
    calc(100vh - 68px);
}

.eit-screen.active{
  display:block;
}


/* =========================================================
   ANIMATION
========================================================= */

.eit-fade{

  animation:
    eitFadeIn
    .22s
    ease-out;
}

@keyframes eitFadeIn{

  from{

    opacity:0;

    transform:
      translateY(5px);
  }

  to{

    opacity:1;

    transform:
      translateY(0);
  }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px){

  .eit-main{

    padding-left:12px;
    padding-right:12px;
  }

  .eit-hero{

    padding:21px 17px;

    border-radius:21px;
  }

  .eit-hero h1{

    font-size:27px;
  }

  .eit-faculties{

    gap:9px;
  }

  .eit-faculty{

    min-height:175px;

    padding:15px;

    border-radius:17px;
  }

  .eit-faculty-title{

    font-size:18px;
  }
}

@media(max-width:340px){

  .eit-faculties{

    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<div id="app">

  <header class="eit-topbar">

    <div class="eit-brand">

      <div class="eit-logo">
        EIT
      </div>

      <div>

        <div class="eit-brand-title">
          EIT Academy
        </div>

        <div class="eit-brand-subtitle">

    <button

      👤

  </header>


  <main class="eit-main">

    <section
      id="eit-home-screen"

    >

      <div class="eit-hero">

        <div class="eit-eyebrow">

        </div>

        <h1>
          Профессиональное обучение
        </h1>

        <p>

          всё в одной системе.
        </p>

      </div>


      <div class="eit-section-title">

      </div>


      <div class="eit-faculties">


        <button
          class="eit-faculty eit-electric"
          onclick="eitOpenFaculty('electricity')"
        >

            E
          </div>

        >

          </div>

          <div class="eit-faculty-code">

          </div>

          <div class="eit-faculty-title">
            КИПиА
          </div>

          <div class="eit-faculty-text">
            Датчики, измерения,

          <div class="eit-faculty-arrow">
            →
          </div>

        </button>


        <button
          class="eit-faculty eit-telecom"
          onclick="eitOpenFaculty('telecom')"
        >

          <div class="eit-faculty-icon">
            📡
          </div>

          <div class="eit-faculty-code">
            T
          </div>

          <div class="eit-faculty-title">
            Телеком
          </div>

          <div class="eit-faculty-text">
            Сети, оптика,
            LED и телекоммуникации.
          </div>

          <div class="eit-faculty-arrow">
            →
          </div>

        </button>


        <button
          class="eit-faculty eit-ex"
          onclick="eitOpenFaculty('ex')"
        >

          <div class="eit-faculty-icon">
            ⚠️
          </div>

          <div class="eit-faculty-code">
            EX
          </div>

          <div class="eit-faculty-title">
            EX Academy
          </div>

          <div class="eit-faculty-text">
            Взрывозащита,
            IEC 60079 и инспекция EX.
          </div>

          <div class="eit-faculty-arrow">
            →
          </div>

        </button>

      </div>


      <div class="eit-info-card">

        <div class="eit-info-row">

          <div class="eit-info-icon">
            🎓
          </div>

          <div>

            <div class="eit-info-title">
              Учись. Практикуйся. Расти.
            </div>

            <div class="eit-info-text">
              Профессиональная подготовка

    <section
      id="eit-profile-screen"
      class="eit-screen"
    ></section>


    <section
      id="eit-favorites-screen"
      class="eit-screen"
    ></section>


    <section
      id="eit-settings-screen"
      class="eit-screen"
    ></section>


    <section
      id="eit-progress-screen"
      class="eit-screen"
    ></section>

  </main>


  <nav class="eit-bottom-nav">

    <button
      class="eit-nav-button active"
      onclick="eitShowScreen('eit-home-screen',this)"
    >

      <span class="eit-nav-icon">
        🏠
      </span>

      <span class="eit-nav-label">
        Главная
      </span>

    </button>


    <button
      class="eit-nav-button"
      onclick="eitOpenFavorites()"
    >

      <span class="eit-nav-icon">
        ⭐
      </span>

      <span class="eit-nav-label">
        Избранное
      </span>

    <button
      class="eit-nav-button"
      onclick="eitOpenProgress()"
    >

        📊
      </span>

      <span class="eit-nav-label">
        Прогресс
      </span>

    </button>


    <button
      class="eit-nav-button"
      onclick="eitOpenProfile()"
    >

      <span class="eit-nav-icon">
        👤
      </span>

      <span class="eit-nav-label">
        Профиль
      </span>

    </button>

  </nav>

</div>


<script>

/* =========================================================
   EIT ACADEMY — PART 1 JAVASCRIPT
========================================================= */

const EIT_STATE = {

  currentScreen:
    "eit-home-screen",

  currentFaculty:
    null,

  currentCourse:
    null,

  currentLesson:
    null
};


/* =========================================================
   SCREEN NAVIGATION
========================================================= */

function eitShowScreen(
  screenId,
  button
){

  document
    .querySelectorAll(".eit-screen")
    .forEach(
      screen => {
        screen.classList.remove(
          "active"
        );
      }
    );

  const screen =
    document.getElementById(
      screenId
    );

  if(!screen){
    return;
  }

  screen.classList.add(
    "active",
    "eit-fade"
  );

  EIT_STATE.currentScreen =
    screenId;


  document
    .querySelectorAll(
      ".eit-nav-button"
    )
    .forEach(
      item => {
        item.classList.remove(
          "active"
        );
      }
    );


  if(button){

    button.classList.add(
      "active"
    );

  }

}


/* =========================================================
   ESCAPE
========================================================= */

function eitEscape(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}


/* =========================================================
   BASIC PROFILE
========================================================= */

function eitOpenProfile(){

  const screen =
    document.getElementById(
      "eit-profile-screen"
    );

  if(!screen){
    return;
  }

  screen.innerHTML = `

    <div
      style="
        padding-top:10px;
      "
    >

      <div
        class="eit-hero"
      >

        <div
          class="eit-eyebrow"
        >
          EIT ACADEMY
        </div>

        <h1>
          Профиль
        </h1>

        <p>
          Личный кабинет студента.
        </p>

      </div>


      <div
        class="eit-info-card"
      >

        <div
          class="eit-info-row"
        >

          <div
            class="eit-info-icon"
          >
            👤
          </div>

          <div>

            <div
              class="eit-info-title"
            >
              Студент EIT Academy
            </div>

            <div
              class="eit-info-text"
            >
              Профиль будет расширен
              в следующих модулях.
            </div>

          </div>

        </div>

      </div>

    </div>

  `;

  eitShowScreen(
    "eit-profile-screen"
  );
}


/* =========================================================
   FAVORITES
========================================================= */

function eitOpenFavorites(){

  const screen =
    document.getElementById(
      "eit-favorites-screen"
    );

  if(!screen){
    return;
  }

  screen.innerHTML = `

    <div
      style="
        padding-top:10px;
      "
    >

      <div
        class="eit-hero"
      >

        <div
          class="eit-eyebrow"
        >
          EIT ACADEMY
        </div>

        <h1>
          Избранное
        </h1>

        <p>
          Здесь будут сохранённые
          курсы и учебные материалы.
        </p>

      </div>

    </div>

  `;

  eitShowScreen(
    "eit-favorites-screen"
  );
}


/* =========================================================
   PROGRESS
========================================================= */

function eitOpenProgress(){

  const screen =
    document.getElementById(
      "eit-progress-screen"
    );

  if(!screen){
    return;
  }

  screen.innerHTML = `

    <div
      style="
        padding-top:10px;
      "
    >

      <div
        class="eit-hero"
      >

        <div
          class="eit-eyebrow"
        >
          EIT ACADEMY
        </div>

        <h1>
          Мой прогресс
        </h1>

        <p>
          Здесь будет отображаться
          прогресс обучения.
        </p>

      </div>

    </div>

  `;

  eitShowScreen(
    "eit-progress-screen"
  );
}


/* =========================================================
   SETTINGS
========================================================= */

function eitOpenSettings(){

  const screen =
    document.getElementById(
      "eit-settings-screen"
    );

  if(!screen){
    return;
  }

  screen.innerHTML = `

    <div
      style="
        padding-top:10px;
      "
    >

      <div
        class="eit-hero"
      >

        <div
          class="eit-eyebrow"
        >
          EIT ACADEMY
        </div>

        <h1>
          Настройки
        </h1>

        <p>
          Настройки приложения.
        </p>

      </div>

    </div>

  `;

  eitShowScreen(
    "eit-settings-screen"
  );
}


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    eitShowScreen(
      "eit-home-screen"
    );

  }
);
  /* =========================================================
   EIT ACADEMY — PART 2
   HOME / FACULTIES / COURSES / SEARCH / FAVORITES / PROFILE
   ========================================================= */

(function () {
  "use strict";

  /* ---------- SAFE HELPERS ---------- */

  function eitPart2GetData() {
    return Array.isArray(window.DATA) ? window.DATA : [];
  }

  function eitPart2GetFaculty() {
    return window.currentFaculty || null;
  }

  function eitPart2FindFaculty(id) {
    const faculties = Array.isArray(window.EIT_FACULTIES)
      ? window.EIT_FACULTIES
      : [];

    return faculties.find(f => f.id === id) || null;
  }

  /* ---------- FACULTY OPEN ---------- */

  window.eitOpenFaculty = function (facultyId) {
    const faculty = eitPart2FindFaculty(facultyId);

    if (!faculty) return;

    window.currentFaculty = faculty;

    if (typeof window.show === "function") {
      window.show("faculty");
    }

    if (typeof window.renderFaculty === "function") {
      window.renderFaculty(faculty);
      return;
    }

    const app = document.getElementById("app");

    if (!app) return;

    const courses = eitPart2GetData().filter(course =>
      course.facultyId === faculty.id ||
      course.faculty === faculty.id
    );

    app.innerHTML = `
      <div class="eit-page eit-faculty-page">

        <button class="eit-back-btn"
          onclick="eitGoHome()">
          ← Назад
        </button>

            }

(function () {
  "use strict";

  /* ---------------------------------------------------------
     SAFE HOME
  --------------------------------------------------------- */

  window.eitHome = function () {

    if (
      typeof window.eitRenderHomeV2 === "function"
    ) {
      window.eitRenderHomeV2();
      return;
    }

    if (
      typeof window.renderHome === "function"
    ) {
      window.renderHome();
      return;
    }

    const app =
      document.getElementById("app");

    if (!app) return;

    location.reload();
  };


  /* ---------------------------------------------------------
     MAIN NAVIGATION
  --------------------------------------------------------- */

  window.eitNavigate = function (page) {

    switch (page) {

      case "home":
        eitHome();
        break;

      case "search":
        if (
          typeof window.eitOpenSearchV2 ===
          "function"
        ) {
          window.eitOpenSearchV2();
        }
        break;

      case "progress":
        if (
          typeof window.eitOpenProgressV2 ===
          "function"
        ) {
          window.eitOpenProgressV2();
        }
        break;

      case "profile":
        if (
          typeof window.eitOpenStudentProfile ===
          "function"
        ) {
          window.eitOpenStudentProfile();
        }
        break;

      case "favorites":
        if (
          typeof window.eitOpenFavoritesV2 ===
          "function"
        ) {
          window.eitOpenFavoritesV2();
        }
        break;

      case "admin":
        if (
          typeof window.eitOpenAdminPanel ===
          "function"
        ) {
          window.eitOpenAdminPanel();
        }
        break;

      default:
        eitHome();
    }
  };


  /* ---------------------------------------------------------
     KEYBOARD / ESC
  --------------------------------------------------------- */

  document.addEventListener(
    "keydown",
    function (event) {

      if (event.key === "Escape") {

        eitHome();

      }

    }
  );


  /* ---------------------------------------------------------
     PREVENT ACCIDENTAL FORM SUBMIT
  --------------------------------------------------------- */

  document.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();

    }
  );


  /* ---------------------------------------------------------
     APP START
  --------------------------------------------------------- */

  function startEITAcademy() {

    try {

      if (
        typeof window.eitRenderHomeV2 ===
        "function"
      ) {

        window.eitRenderHomeV2();

        return;

      }

      if (
        typeof window.renderHome ===
        "function"
      ) {

        window.renderHome();

        return;

      }

    } catch (error) {

      console.error(
        "EIT Academy startup error:",
        error
      );

    }

  }


  /* ---------------------------------------------------------
     READY
  --------------------------------------------------------- */

  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      startEITAcademy
    );

  } else {

    startEITAcademy();

  }


  /* ---------------------------------------------------------
     GLOBAL STATUS
  --------------------------------------------------------- */

  window.EIT_ACADEMY_READY = true;

      color:#8d98a8;

      font-size:13px;

      line-height:1.55;
    }


    /* =====================================================
       FACULTY GRID
    ===================================================== */

    .eit-faculties{
      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:10px;

      padding:0 13px;
    }

    .eit-faculty-card{
      position:relative;

      min-height:188px;

      padding:17px;

      overflow:hidden;

      border:
        1px solid rgba(255,255,255,.08);

      border-radius:20px;

      background:#0d121a;

      color:#fff;

      text-align:left;
    }

    .eit-faculty-card:before{

      content:"";

      position:absolute;

      width:100px;
      height:100px;

      right:-35px;
      bottom:-35px;

      border-radius:50%;

      background:
        rgba(59,130,246,.08);

      pointer-events:none;
    }

    .eit-faculty-card:nth-child(2):before{
      background:
        rgba(34,197,94,.08);
    }

    .eit-faculty-card:nth-child(3):before{
      background:
        rgba(168,85,247,.08);
    }

    .eit-faculty-card:nth-child(4):before{
      background:
        rgba(245,158,11,.08);
    }

    .eit-faculty-icon{
      width:48px;
      height:48px;

      display:flex;
      align-items:center;
      justify-content:center;

      margin-bottom:17px;

      border-radius:15px;

      background:#151d28;

      font-size:23px;
    }

    .eit-faculty-number{
      display:block;

      color:#667085;

      font-size:9px;
      font-weight:1000;

      letter-spacing:1.5px;
    }

    .eit-faculty-info h3{
      margin:4px 0 6px;

      font-size:18px;
    }

    .eit-faculty-info p{
      margin:0;

      color:#8994a4;

      font-size:10px;

      line-height:1.45;
    }

    .eit-card-arrow{
      position:absolute;

      right:15px;
      bottom:13px;

      color:#667085;

      font-size:18px;
    }


    /* =====================================================
       QUICK MENU
    ===================================================== */

    .eit-quick-menu{
      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:9px;

      margin:14px 13px 0;
    }

    .eit-quick-menu button{
      min-height:78px;

      display:flex;

      flex-direction:column;

      align-items:flex-start;

      justify-content:center;

      gap:6px;

      padding:13px;

      border:
        1px solid rgba(255,255,255,.07);

      border-radius:16px;

      background:#0d121a;

      color:#fff;

      text-align:left;
    }

    .eit-quick-menu span{
      font-size:19px;
    }

    .eit-quick-menu strong{
      font-size:10px;
    }


    /* =====================================================
       BOTTOM NAV
    ===================================================== */

    .eit-bottom-nav{
      position:fixed;

      left:50%;
      bottom:11px;

      z-index:100;

      transform:
        translateX(-50%);

      width:min(
        calc(100% - 24px),
        730px
      );

      display:grid;

      grid-template-columns:
        repeat(4,1fr);

      gap:5px;

      padding:7px;

      border:
        1px solid rgba(255,255,255,.10);

      border-radius:22px;

      background:
        rgba(13,18,26,.95);

      backdrop-filter:blur(20px);

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.45);
    }

    .eit-bottom-nav button{
      min-height:55px;

      border:0;

      border-radius:16px;

      background:transparent;

      color:#697586;

      font-size:17px;
    }

    .eit-bottom-nav button.active{
      color:#fff;

      background:
        rgba(59,130,246,.14);
    }

    .eit-bottom-nav small{
      display:block;

      margin-top:3px;

      font-size:8px;

      font-weight:800;
    }


    /* =====================================================
       SEARCH
    ===================================================== */

    .eit-search-input{
      width:100%;

      padding:15px 16px;

      margin:8px 0 16px;

      border:
        1px solid rgba(255,255,255,.09);

      border-radius:15px;

      outline:none;

      background:#0d121a;

      color:#fff;

      font-size:14px;
    }

    .eit-search-input:focus{
      border-color:
        rgba(59,130,246,.55);
    }


    /* =====================================================
       PROGRESS
    ===================================================== */

    .eit-progress-list{
      display:flex;

      flex-direction:column;

      gap:10px;
    }

    .eit-progress-card{
      padding:16px;

      border:
        1px solid rgba(255,255,255,.08);

      border-radius:17px;

      background:#0d121a;
    }

    .eit-progress-card strong{
      display:block;

      font-size:13px;
    }

    .eit-progress-card small{
      display:block;

      margin-top:4px;

      color:#7f8997;

      font-size:10px;
    }

    .eit-progress-card b{
      display:block;

      margin-top:7px;

      color:#60a5fa;

      font-size:11px;
    }

    .eit-progress-bar{
      height:7px;

      margin-top:11px;

      overflow:hidden;

      border-radius:99px;

      background:#192230;
    }

    .eit-progress-bar span{
      display:block;

      height:100%;

      border-radius:99px;

      background:#3b82f6;
    }


    /* =====================================================
       ADMIN
    ===================================================== */

    .eit-admin-page{
      background:#070a0f;
    }

    .eit-admin-page input,
    .eit-admin-page textarea{
      color:#fff;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width:430px){

      .eit-welcome{
        margin-left:10px;
        margin-right:10px;

        padding:22px 17px;
      }

      .eit-welcome h1{
        font-size:27px;
      }

      .eit-faculties{
        padding:0 10px;
        gap:8px;
      }

      .eit-faculty-card{
        min-height:172px;
        padding:14px;
      }

      .eit-faculty-info h3{
        font-size:16px;
      }

      .eit-quick-menu{
        margin-left:10px;
        margin-right:10px;
      }

    }

    @media(max-width:340px){

      .eit-faculties{
        grid-template-columns:1fr;
      }

      .eit-quick-menu{
        grid-template-columns:1fr;
      }

    }
