<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EIT Academy</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1117;
  color: white;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 60px 20px;
  text-align: center;
}

h1 {
  font-size: 48px;
  margin-bottom: 20px;
}

p {
  font-size: 20px;
  color: #b8bec9;
  line-height: 1.6;
}

.button {
  display: inline-block;
  margin-top: 30px;
  padding: 15px 30px;
  background: #6c2bd9;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-size: 18px;
}

.button:hover {
  background: #833cff;
}
</style>
</head>

<body>

<div class="container">
  <h1>EIT Academy</h1>

  <p>
    Профессиональная платформа обучения
    для Electrical, Instrumentation, Telecom, EX и CompEx.
  </p>

 <button class="button" onclick="startLearning()">Начать обучение</button>
</div>
<script>
function startLearning() {
 document.querySelector('.container').innerHTML = `
<h1>Обучение EIT Academy</h1>
<p>Выберите направление обучения:</p>
<button class="button" onclick="alert('Electrical')">Electrical</button>
<button class="button" onclick="alert('Instrumentation')">Instrumentation</button>
<button class="button" onclick="alert('Telecom')">Telecom</button>
<button class="button" onclick="alert('EX')">EX</button>
<button class="button" onclick="alert('CompEx')">CompEx</button>
`;
}
</script>
<section style="margin-top:40px;padding:30px 20px;background:#171b24;border-radius:18px;">
  <h2 style="font-size:32px;margin-bottom:12px;">CompEx</h2>

  <p style="font-size:18px;line-height:1.6;">
    Профессиональная подготовка и сертификация по CompEx
    для специалистов, работающих во взрывоопасных зонах.
  </p>

  <div style="display:grid;gap:14px;margin-top:25px;">
    <button class="button" onclick="alert('CompEx Foundation — базовая подготовка')">
      CompEx Foundation
    </button>

    <button class="button" onclick="alert('CompEx Electrical — электрические установки во взрывоопасных зонах')">
      CompEx Electrical
    </button>

    <button class="button" onclick="alert('CompEx Instrumentation — КИПиА во взрывоопасных зонах')">
      CompEx Instrumentation
    </button>

    <button class="button" onclick="alert('Учебные материалы CompEx будут доступны здесь')">
      Учебные материалы
    </button>
  </div>
</section></body>
</html>
