<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EIT Academy</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1117;
  color: white;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 60px 20px;
  text-align: center;
}

h1 {
  font-size: 48px;
  margin-bottom: 20px;
}

p {
  font-size: 20px;
  color: #b8bec9;
  line-height: 1.6;
}

.button {
  display: inline-block;
  margin-top: 30px;
  padding: 15px 30px;
  background: #6c2bd9;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-size: 18px;
}

.button:hover {
  background: #833cff;
}
</style>
</head>

<body>

<div class="container">
  <h1>EIT Academy</h1>

  <p>
    Профессиональная платформа обучения
    для Electrical, Instrumentation, Telecom, EX и CompEx.
  </p>

 <button class="button" onclick="startLearning()">Начать обучение</button>
</div>
<script>
function startLearning() {
  alert("Раздел обучения скоро будет доступен.");
}
</script>
</body>
</html>
